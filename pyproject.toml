[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "manimind"
version = "0.1.0"
description = "Multi-agent orchestration for mathematical explainer animation production."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
pdf = [
  "pypdf>=5.0.0",
]
llm = [
  "openai>=1.30.0",
  "python-dotenv>=0.21,<2",
]
api = [
  "fastapi>=0.111.0",
  "uvicorn>=0.30.0",
]
render = [
  "manimgl>=1.7.2,<1.8",
  "setuptools<81",
  "static-ffmpeg>=3,<4; sys_platform == 'darwin'",
]
components = [
  "sympy>=1.13,<2",
]
render-ce = [
  "manim>=0.20.1",
  "manim-voiceover[gtts]>=0.3.7",
]
dev = [
  "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"manimind.postproduce" = ["templates/*.html"]
